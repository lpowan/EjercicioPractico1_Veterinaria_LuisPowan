<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="contenido" class="container py-5">

    <div class="encabezado-pagina">
        <div>
            <h1 class="titulo-pagina"><i class="bi bi-bookmark-star me-2"></i><span th:text="#{tipos.titulo}">Tipos</span></h1>
            <p class="text-secondary mb-0" th:text="#{tipos.subtitulo}">Subtítulo</p>
        </div>
        <a th:href="@{/tipos/nuevo}" class="btn btn-bosque rounded-pill px-4">
            <i class="bi bi-plus-lg me-1"></i><span th:text="#{tipos.nuevo}">Nuevo</span>
        </a>
    </div>

    <div class="panel">
        <div class="panel-barra">
            <span th:text="#{tipos.total(${#lists.size(tipos)})}">Total</span>
        </div>
        <div class="table-responsive">
            <table class="table tabla-clinica align-middle mb-0">
                <thead>
                    <tr>
                        <th th:text="#{tipos.columna.id}">#</th>
                        <th th:text="#{tipos.columna.nombre}">Nombre</th>
                        <th th:text="#{tipos.columna.descripcion}">Descripción</th>
                        <th class="text-center" th:text="#{tipos.columna.cantidad}">Cantidad</th>
                        <th class="text-end" th:text="#{general.acciones}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tipo : ${tipos}">
                        <td class="text-secondary" th:text="${tipo.id}">1</td>
                        <td class="fw-semibold" th:text="${tipo.nombre}">Nombre</td>
                        <td th:text="${tipo.descripcion} ?: '—'">Descripción</td>
                        <!-- Cantidad de servicios con la relacion @OneToMany -->
                        <td class="text-center">
                            <span class="contador" th:text="${#lists.size(tipo.servicios)}">0</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/tipos/editar/{id}(id=${tipo.id})}" class="btn btn-accion"
                               th:title="#{general.editar}" th:aria-label="#{general.editar}">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button type="button" class="btn btn-accion btn-accion-peligro"
                                    data-bs-toggle="modal" data-bs-target="#ventanaConfirmacion"
                                    th:data-id="${tipo.id}" th:data-nombre="${tipo.nombre}"
                                    th:title="#{general.eliminar}" th:aria-label="#{general.eliminar}">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tipos)}">
                        <td colspan="5" class="text-center text-secondary py-5" th:text="#{tipos.vacio}">Vacío</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{componentes/confirmacion :: confirmacion(@{/tipos/eliminar})}"></div>
</section>
</body>
</html>
