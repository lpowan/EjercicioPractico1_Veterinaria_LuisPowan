<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="contenido" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7">
            <a th:href="@{/tipos}" class="enlace-volver">
                <i class="bi bi-arrow-left me-1"></i><span th:text="#{general.regresar}">Regresar</span>
            </a>
            <div class="panel mt-3">
                <div class="panel-cabecera">
                    <h1 class="h4 fw-bold mb-0"
                        th:text="${tipoServicio.id == null} ? #{tipos.form.nuevo} : #{tipos.form.editar}">Formulario</h1>
                </div>
                <form th:action="@{/tipos/guardar}" th:object="${tipoServicio}" method="post" class="p-4">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" th:field="*{nombre}"
                               th:placeholder="#{tipos.placeholder.nombre}" maxlength="100" required>
                        <label for="nombre" th:text="#{tipos.campo.nombre}">Nombre</label>
                    </div>

                    <div class="form-floating mb-4">
                        <textarea class="form-control area-texto" th:field="*{descripcion}"
                                  th:placeholder="#{tipos.placeholder.descripcion}" maxlength="255"></textarea>
                        <label for="descripcion" th:text="#{tipos.campo.descripcion}">Descripción</label>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/tipos}" class="btn btn-light rounded-pill px-4" th:text="#{general.cancelar}">Cancelar</a>
                        <button type="submit" class="btn btn-bosque rounded-pill px-4">
                            <i class="bi bi-check2 me-1"></i><span th:text="#{general.guardar}">Guardar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
