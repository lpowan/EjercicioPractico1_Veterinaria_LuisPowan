spring.application.name=veterinaria

# Puerto solicitado
server.port=8086

# Conexion a la base de datos veterinaria_citas (MySQL local)
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_citas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica
spring.datasource.username=usuario_caso_practico_01_var
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: las tablas las crea el script, Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Thymeleaf y archivo de idioma
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
